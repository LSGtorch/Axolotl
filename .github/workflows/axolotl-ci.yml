name: Axolotl Windows Build

on:
  push:
    branches: [build-windows]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-2025
    env:
      SQLX_OFFLINE: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: ./.github/actions/replace-gradle-mirror
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @modrinth/app tauri build --config tauri.windows.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: axolotl-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
