name: Axolotl Windows Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: axolotl-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-2025
    env:
      SQLX_OFFLINE: true
      CURSEFORGE_API_KEY: *** secrets.CURSEFORGE_API_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: *** secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: *** secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @modrinth/app tauri build --config tauri.windows.conf.json
      - uses: softprops/action-gh-release@c95fe9189394c2b1b8d12e97a0f68dc1cb5d6d02 # v2.2.1
        with:
          generate_release_notes: true
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
